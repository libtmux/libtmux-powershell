width = 80
markdown = ["**/*.md"]
sources = ["examples/**/*.ps1"]
shared_digest = "d88f61cb1725be8a1b56ae6e1b2346dc868599842758e3484cd3f5979342b915"
checker_digest = "782f2eccc3ee1eff46e21f26102c640bd215778fc527608465d99a155f34d857"
allow_ceiling = 1

[[exclude]]
glob = "THIRD-PARTY-NOTICES.md"
reason = "licence notices copied from third parties"

[[exclude]]
glob = "tests/fixtures/**/*.md"
reason = "index of the unchanged upstream tmuxp fixtures the corpus test compares"

[[allow]]
path = ".github/WRITING.md"
line = "        -Name ('pane-run-' + [Guid]::NewGuid().ToString('N')) -Command 'exec /bin/sh'"
reason = "the Bad example in the port block; it shows the width problem the Good example fixes"
