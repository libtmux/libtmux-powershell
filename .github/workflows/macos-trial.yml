# Hosted macOS trial: report suite failures without blocking the Linux baseline.
# Passing suites are still required before making a macOS support claim.
# The trial consumes the same published .NET dependencies and locks as Linux.
name: powershell macOS trial (advisory)

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_REVISION: 8d47af7d89638ad267528ac56897cec67df597f7
  CORE_PACKAGE_VERSION: '0.1.1'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  package:
    name: published dependency packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install official PowerShell 7.4.20 for packaging
        run: pwsh -NoLogo -NoProfile -File scripts/install-powershell/InstallPowerShell.ps1 -Version 7.4.20

      - name: Restore locked dependencies
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File eng/Build.ps1
          -Restore
          -PackageCache "${RUNNER_TEMP}/port-nuget-cache"

      - name: Pack the modules
        env:
          PSModulePath: ${{ github.workspace }}/build/Modules
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File eng/Package.ps1
          -DestinationPath "${RUNNER_TEMP}/port-package"

      - name: Record the core dependency versions
        run: >-
          cp build/Modules/LibTmux/0.1.0/dependencies.json
          "${RUNNER_TEMP}/port-package/core-dependencies.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-trial-package
          path: ${{ runner.temp }}/port-package/
          if-no-files-found: error
          retention-days: 7

  matrix:
    needs: package
    name: ${{ matrix.runner }} / PowerShell ${{ matrix.powershell }} / tmux ${{ matrix.tmux }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            asset_arch: x64
            powershell: '7.4.20'
            powershell_sha256: 634d04e806b37a441b140c875e96662a5eb14efd0e38060a730b991069602138
            tmux: '3.3a'
            tmux_commit: 0b355ae8114511e1ff6359272b164f1cdf718e80
          - runner: macos-15-intel
            arch: x86_64
            asset_arch: x64
            powershell: '7.4.20'
            powershell_sha256: 634d04e806b37a441b140c875e96662a5eb14efd0e38060a730b991069602138
            tmux: '3.7c'
            tmux_commit: e476c1230b958df0cb12977517d24b3dc931375b
          - runner: macos-15-intel
            arch: x86_64
            asset_arch: x64
            powershell: '7.6.6'
            powershell_sha256: e325ed9f666894eb39a5ea52800b602da2fb4242bbe9747ceddb39cdc66de805
            tmux: '3.3a'
            tmux_commit: 0b355ae8114511e1ff6359272b164f1cdf718e80
          - runner: macos-15-intel
            arch: x86_64
            asset_arch: x64
            powershell: '7.6.6'
            powershell_sha256: e325ed9f666894eb39a5ea52800b602da2fb4242bbe9747ceddb39cdc66de805
            tmux: '3.7c'
            tmux_commit: e476c1230b958df0cb12977517d24b3dc931375b
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
            powershell: '7.4.20'
            powershell_sha256: 7f9a2503304ee239330f5c4ccc7eef11894b095d7ccb8f9fa78a16c6ee508edc
            tmux: '3.3a'
            tmux_commit: 0b355ae8114511e1ff6359272b164f1cdf718e80
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
            powershell: '7.4.20'
            powershell_sha256: 7f9a2503304ee239330f5c4ccc7eef11894b095d7ccb8f9fa78a16c6ee508edc
            tmux: '3.7c'
            tmux_commit: e476c1230b958df0cb12977517d24b3dc931375b
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
            powershell: '7.6.6'
            powershell_sha256: 6df833d094ebac1c1a74340d7b3437f4aaf5e03ce640484a1c4359f3ce8b3db1
            tmux: '3.3a'
            tmux_commit: 0b355ae8114511e1ff6359272b164f1cdf718e80
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
            powershell: '7.6.6'
            powershell_sha256: 6df833d094ebac1c1a74340d7b3437f4aaf5e03ce640484a1c4359f3ce8b3db1
            tmux: '3.7c'
            tmux_commit: e476c1230b958df0cb12977517d24b3dc931375b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libtmux/libtmux-dotnet
          ref: ${{ env.CORE_REVISION }}
          path: core
          persist-credentials: false

      - name: Verify the runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(uname -m)" = "${EXPECTED_ARCH}"

      - name: Install official PowerShell ${{ matrix.powershell }}
        env:
          POWERSHELL_VERSION: ${{ matrix.powershell }}
          POWERSHELL_SHA256: ${{ matrix.powershell_sha256 }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: >-
          pwsh -NoLogo -NoProfile
          -File scripts/install-powershell/InstallPowerShell.ps1
          -Version "${POWERSHELL_VERSION}"
          -Platform "osx-${ASSET_ARCH}"
          -Sha256 "${POWERSHELL_SHA256}"

      - name: Verify the PowerShell architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(lipo -archs "${RUNNER_TEMP}/powershell/pwsh")" = "${EXPECTED_ARCH}"

      - name: Verify the core checkout
        run: test "$(git -C core rev-parse HEAD)" = "${CORE_REVISION}"

      # The shared build-tmux action installs its dependencies with apt, so it
      # does not run on macOS.
      - name: Build tmux ${{ matrix.tmux }} from its pinned source tag
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
          TMUX_SOURCE_COMMIT: ${{ matrix.tmux_commit }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/build-tmux-macos/BuildTmuxMacos.ps1
          -Version "${TMUX_VERSION}"
          -SourceCommit "${TMUX_SOURCE_COMMIT}"
          -Architecture "${EXPECTED_ARCH}"
          -Root "${GITHUB_WORKSPACE}/core/artifacts/tmux"
          -DependenciesFile "${RUNNER_TEMP}/tmux-build-dependencies.txt"
          -Jobs 3
          -GithubPath "${GITHUB_PATH}"
          -GithubEnv "${GITHUB_ENV}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-trial-package
          path: ${{ runner.temp }}/port-package

      - name: Verify package and binary provenance
        env:
          CORE_VERSION: ${{ env.CORE_PACKAGE_VERSION }}
          TMUX_VERSION: ${{ matrix.tmux }}
          TMUX_SOURCE_COMMIT: ${{ matrix.tmux_commit }}
          POWERSHELL_VERSION: ${{ matrix.powershell }}
          POWERSHELL_SHA256: ${{ matrix.powershell_sha256 }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/macos-trial/MacosTrial.ps1
          provenance
          -Runner "${RUNNER_NAME}"
          -Architecture "${EXPECTED_ARCH}"
          -Core core
          -CoreRevision "${CORE_REVISION}"
          -CoreVersion "${CORE_VERSION}"
          -Powershell "${POWERSHELL_VERSION}"
          -PowershellSha256 "${POWERSHELL_SHA256}"
          -PowershellBinary "${RUNNER_TEMP}/powershell/pwsh"
          -Tmux "${TMUX_VERSION}"
          -TmuxCommit "${TMUX_SOURCE_COMMIT}"
          -TmuxBinary "${TMUX_BINARY}"
          -PackageRoot "${RUNNER_TEMP}/port-package"
          -DependenciesFile "${RUNNER_TEMP}/tmux-build-dependencies.txt"
          -Output build/macos-provenance.json

      - name: Run installed version check suite
        id: version-check
        timeout-minutes: 5
        continue-on-error: true
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite VersionCheck -PackageRoot "${RUNNER_TEMP}/port-package"

      - name: Run installed features suite
        id: features
        timeout-minutes: 5
        continue-on-error: true
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite Features -PackageRoot "${RUNNER_TEMP}/port-package"

      - name: Run installed product suite
        id: product
        timeout-minutes: 15
        continue-on-error: true
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite Product -PackageRoot "${RUNNER_TEMP}/port-package"

      - name: Run installed documentation examples
        id: documentation
        timeout-minutes: 10
        continue-on-error: true
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite Documentation -PackageRoot "${RUNNER_TEMP}/port-package"

      - name: Report both suite conclusions
        if: always()
        env:
          VERSION_CHECK_OUTCOME: ${{ steps.version-check.outcome }}
          FEATURES_OUTCOME: ${{ steps.features.outcome }}
          PRODUCT_OUTCOME: ${{ steps.product.outcome }}
          DOCUMENTATION_OUTCOME: ${{ steps.documentation.outcome }}
          CELL_RUNNER: ${{ matrix.runner }}
          CELL_POWERSHELL: ${{ matrix.powershell }}
          CELL_TMUX: ${{ matrix.tmux }}
        run: >-
          pwsh -NoLogo -NoProfile
          -File scripts/macos-trial/MacosTrial.ps1
          report
          -Runner "${CELL_RUNNER}"
          -Powershell "${CELL_POWERSHELL}"
          -Tmux "${CELL_TMUX}"
          -VersionCheck "${VERSION_CHECK_OUTCOME}"
          -Features "${FEATURES_OUTCOME}"
          -Product "${PRODUCT_OUTCOME}"
          -Documentation "${DOCUMENTATION_OUTCOME}"
          -Output build/macos-cell.json
          -Summary "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ matrix.runner }}-powershell-${{ matrix.powershell }}-tmux-${{ matrix.tmux }}
          path: |
            build/macos-cell.json
            build/macos-provenance.json
            build/test-Product.json
            build/test-Documentation.json
            ${{ runner.temp }}/port-package/package-evidence.json
            ${{ runner.temp }}/port-package/core-dependencies.json
          if-no-files-found: warn
          retention-days: 7

  gate:
    needs: [package, matrix]
    if: always()
    name: macOS trial gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the package build
        env:
          RESULT: ${{ needs.package.result }}
        run: test "${RESULT}" = success

      - name: Require the trial reporting
        env:
          RESULT: ${{ needs.matrix.result }}
        run: test "${RESULT}" = success
