# Hosted macOS trial: report suite failures without blocking the Linux baseline.
# Passing suites are still required before making a macOS support claim.
# CI rebuilds a unique .NET review version from a pinned commit and updates the
# disposable checkout's locks. It does not prove committed unpublished archive bytes.
name: powershell macOS trial (advisory)

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_REVISION: 55a3f4180f3ff48d54e62cb567cd245878ea2f4a
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  package:
    name: source-pinned installed packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libtmux/libtmux-dotnet
          ref: ${{ env.CORE_REVISION }}
          path: core
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: core/global.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Choose a unique version for the pinned source
        id: version
        run: |
          test "$(git -C core rev-parse HEAD)" = "${CORE_REVISION}"
          review_version="$(python3 eng/ci/review_dependencies.py version \
            --run-id "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}")"
          echo "value=${review_version}" >> "${GITHUB_OUTPUT}"

      - name: Build and inspect the shared packages
        env:
          REVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 core/eng/package_review.py \
            --version "${REVIEW_VERSION}" \
            --revision "${CORE_REVISION}" \
            --output "${RUNNER_TEMP}/core-review"
          jq -e --arg revision "${CORE_REVISION}" --arg version "${REVIEW_VERSION}" \
            '.revision == $revision and .version == $version and .inspection == "passed"' \
            "${RUNNER_TEMP}/core-review/provenance.json"

      - name: Install official PowerShell 7.4.20 for packaging
        run: |
          archive="${RUNNER_TEMP}/powershell-7.4.20-linux-x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/PowerShell/PowerShell/releases/download/v7.4.20/powershell-7.4.20-linux-x64.tar.gz \
            --output "${archive}"
          echo "ed8008345c7f5337f5e293145f5e243ce132e5ee4dfc24ac551c45a4b3092181  ${archive}" \
            | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/powershell"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/powershell"
          chmod +x "${RUNNER_TEMP}/powershell/pwsh"
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -Command \
            "if (\$PSVersionTable.PSVersion.ToString() -cne '7.4.20') { throw 'Unexpected PowerShell version' }; Import-Module Microsoft.PowerShell.PSResourceGet -RequiredVersion 1.1.1"

      - name: Resolve and pack the reviewed dependencies
        env:
          REVIEW_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 -m unittest discover -s eng/ci -p 'test_*.py'
          python3 eng/ci/review_dependencies.py prepare \
            --version "${REVIEW_VERSION}" \
            --baseline "${RUNNER_TEMP}/ci-lock-baseline"
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Build.ps1 \
            -Restore -UpdateLock \
            -CorePackageDirectory "${RUNNER_TEMP}/core-review" \
            -PackageCache "${RUNNER_TEMP}/port-nuget-cache"
          python3 eng/ci/review_dependencies.py verify \
            --version "${REVIEW_VERSION}" \
            --baseline "${RUNNER_TEMP}/ci-lock-baseline"
          PSModulePath="${GITHUB_WORKSPACE}/build/Modules" \
            "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Package.ps1 \
            -DestinationPath "${RUNNER_TEMP}/port-package"
          cp "${RUNNER_TEMP}/core-review/provenance.json" \
            "${RUNNER_TEMP}/port-package/core-provenance.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-trial-package
          path: ${{ runner.temp }}/port-package/
          if-no-files-found: error
          retention-days: 7

  matrix:
    needs: package
    name: ${{ matrix.runner }} / PowerShell ${{ matrix.powershell }} / tmux ${{ matrix.tmux }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            asset_arch: x64
            powershell: '7.4.20'
            powershell_sha256: 634d04e806b37a441b140c875e96662a5eb14efd0e38060a730b991069602138
            tmux: '3.2a'
            tmux_commit: 3b929f332aafa7f1080eacc31feb11ffbb1d1841
          - runner: macos-15-intel
            arch: x86_64
            asset_arch: x64
            powershell: '7.4.20'
            powershell_sha256: 634d04e806b37a441b140c875e96662a5eb14efd0e38060a730b991069602138
            tmux: '3.7c'
            tmux_commit: e476c1230b958df0cb12977517d24b3dc931375b
          - runner: macos-15-intel
            arch: x86_64
            asset_arch: x64
            powershell: '7.6.6'
            powershell_sha256: e325ed9f666894eb39a5ea52800b602da2fb4242bbe9747ceddb39cdc66de805
            tmux: '3.2a'
            tmux_commit: 3b929f332aafa7f1080eacc31feb11ffbb1d1841
          - runner: macos-15-intel
            arch: x86_64
            asset_arch: x64
            powershell: '7.6.6'
            powershell_sha256: e325ed9f666894eb39a5ea52800b602da2fb4242bbe9747ceddb39cdc66de805
            tmux: '3.7c'
            tmux_commit: e476c1230b958df0cb12977517d24b3dc931375b
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
            powershell: '7.4.20'
            powershell_sha256: 7f9a2503304ee239330f5c4ccc7eef11894b095d7ccb8f9fa78a16c6ee508edc
            tmux: '3.2a'
            tmux_commit: 3b929f332aafa7f1080eacc31feb11ffbb1d1841
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
            powershell: '7.4.20'
            powershell_sha256: 7f9a2503304ee239330f5c4ccc7eef11894b095d7ccb8f9fa78a16c6ee508edc
            tmux: '3.7c'
            tmux_commit: e476c1230b958df0cb12977517d24b3dc931375b
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
            powershell: '7.6.6'
            powershell_sha256: 6df833d094ebac1c1a74340d7b3437f4aaf5e03ce640484a1c4359f3ce8b3db1
            tmux: '3.2a'
            tmux_commit: 3b929f332aafa7f1080eacc31feb11ffbb1d1841
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
            powershell: '7.6.6'
            powershell_sha256: 6df833d094ebac1c1a74340d7b3437f4aaf5e03ce640484a1c4359f3ce8b3db1
            tmux: '3.7c'
            tmux_commit: e476c1230b958df0cb12977517d24b3dc931375b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libtmux/libtmux-dotnet
          ref: ${{ env.CORE_REVISION }}
          path: core
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          architecture: ${{ matrix.asset_arch }}

      - name: Verify Python PTY support and runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "${EXPECTED_ARCH}"
          python3 -c 'import os, platform, sys; assert sys.version_info[:3] == (3, 13, 15); assert platform.machine() == os.environ["EXPECTED_ARCH"]; assert hasattr(os, "waitid") and hasattr(os, "WNOWAIT")'

      - name: Install official PowerShell ${{ matrix.powershell }}
        env:
          POWERSHELL_VERSION: ${{ matrix.powershell }}
          POWERSHELL_SHA256: ${{ matrix.powershell_sha256 }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          archive="${RUNNER_TEMP}/powershell-${POWERSHELL_VERSION}-osx-${ASSET_ARCH}.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/PowerShell/PowerShell/releases/download/v${POWERSHELL_VERSION}/powershell-${POWERSHELL_VERSION}-osx-${ASSET_ARCH}.tar.gz" \
            --output "${archive}"
          digest="$(shasum -a 256 "${archive}" | awk '{print $1}')"
          test "${digest}" = "${POWERSHELL_SHA256}"
          mkdir -p "${RUNNER_TEMP}/powershell"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/powershell"
          chmod +x "${RUNNER_TEMP}/powershell/pwsh"
          test "$(lipo -archs "${RUNNER_TEMP}/powershell/pwsh")" = "${EXPECTED_ARCH}"
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -Command \
            "if (\$PSVersionTable.PSVersion.ToString() -cne \$env:POWERSHELL_VERSION) { throw 'Unexpected PowerShell version' }"

      - name: Build tmux ${{ matrix.tmux }} from its pinned source tag
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
          TMUX_SOURCE_COMMIT: ${{ matrix.tmux_commit }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          LIBTMUX_BUILD_JOBS: '3'
        run: |
          test "$(git -C core rev-parse HEAD)" = "${CORE_REVISION}"
          brew install autoconf automake bison pkg-config libevent ncurses utf8proc jemalloc jq
          PATH="$(brew --prefix bison)/bin:${PATH}"
          PKG_CONFIG_PATH="$(brew --prefix libevent)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix utf8proc)/lib/pkgconfig:$(brew --prefix jemalloc)/lib/pkgconfig"
          export PATH PKG_CONFIG_PATH
          pkg-config --exists libutf8proc jemalloc
          source="${GITHUB_WORKSPACE}/core/artifacts/tmux/sources/${TMUX_VERSION}"
          mkdir -p "$(dirname "${source}")"
          git clone --depth 1 --branch "${TMUX_VERSION}" https://github.com/tmux/tmux.git "${source}"
          test "$(git -C "${source}" rev-parse HEAD)" = "${TMUX_SOURCE_COMMIT}"
          test "$(git -C "${source}" describe --tags --exact-match HEAD)" = "${TMUX_VERSION}"
          core/eng/tmux/build-version.sh "${TMUX_VERSION}"
          binary="${GITHUB_WORKSPACE}/core/artifacts/tmux/installs/${TMUX_VERSION}/bin/tmux"
          test -x "${binary}"
          test "$(cat "core/artifacts/tmux/installs/${TMUX_VERSION}/source-commit")" = "${TMUX_SOURCE_COMMIT}"
          test "$("${binary}" -V)" = "tmux ${TMUX_VERSION}"
          test "$(lipo -archs "${binary}")" = "${EXPECTED_ARCH}"
          printf '%s\n' "$(dirname "${binary}")" >> "${GITHUB_PATH}"
          printf 'TMUX_BINARY=%s\n' "${binary}" >> "${GITHUB_ENV}"
          brew list --versions autoconf automake bison pkgconf libevent ncurses utf8proc jemalloc jq \
            > "${RUNNER_TEMP}/tmux-build-dependencies.txt"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-trial-package
          path: ${{ runner.temp }}/port-package

      - name: Verify package and binary provenance
        env:
          REVIEW_VERSION: ${{ needs.package.outputs.version }}
          TMUX_VERSION: ${{ matrix.tmux }}
          TMUX_SOURCE_COMMIT: ${{ matrix.tmux_commit }}
          POWERSHELL_VERSION: ${{ matrix.powershell }}
          POWERSHELL_SHA256: ${{ matrix.powershell_sha256 }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(command -v tmux)" = "${TMUX_BINARY}"
          test "$(git -C core rev-parse HEAD)" = "${CORE_REVISION}"
          jq -e --arg revision "${CORE_REVISION}" --arg version "${REVIEW_VERSION}" \
            '.revision == $revision and .version == $version and .inspection == "passed"' \
            "${RUNNER_TEMP}/port-package/core-provenance.json"
          jq -e '.packages | length == 2 and ([.[].file] | sort) == ["LibTmux.0.1.0.nupkg", "LibTmux.Workspace.0.1.0.nupkg"]' \
            "${RUNNER_TEMP}/port-package/package-evidence.json"
          jq -r '.packages[] | [.sha256, .file] | @tsv' \
            "${RUNNER_TEMP}/port-package/package-evidence.json" \
            | while IFS=$'\t' read -r digest file; do
                actual="$(shasum -a 256 "${RUNNER_TEMP}/port-package/${file}" | awk '{print $1}')"
                test "${actual}" = "${digest}"
              done
          mkdir -p build
          jq -n \
            --arg runner "${RUNNER_NAME}" \
            --arg arch "${EXPECTED_ARCH}" \
            --arg core "${CORE_REVISION}" \
            --arg reviewVersion "${REVIEW_VERSION}" \
            --arg powershell "${POWERSHELL_VERSION}" \
            --arg powershellSha256 "${POWERSHELL_SHA256}" \
            --arg powershellBinarySha256 "$(shasum -a 256 "${RUNNER_TEMP}/powershell/pwsh" | awk '{print $1}')" \
            --arg tmux "${TMUX_VERSION}" \
            --arg tmuxCommit "${TMUX_SOURCE_COMMIT}" \
            --arg tmuxSha256 "$(shasum -a 256 "${TMUX_BINARY}" | awk '{print $1}')" \
            --arg python "$(python3 --version)" \
            --rawfile buildDependencies "${RUNNER_TEMP}/tmux-build-dependencies.txt" \
            --slurpfile packages "${RUNNER_TEMP}/port-package/package-evidence.json" \
            '{runner:$runner,arch:$arch,coreRevision:$core,reviewVersion:$reviewVersion,
              powershell:$powershell,powershellSha256:$powershellSha256,
              powershellBinarySha256:$powershellBinarySha256,
              tmux:$tmux,tmuxCommit:$tmuxCommit,tmuxSha256:$tmuxSha256,
              python:$python,buildDependencies:$buildDependencies,packages:$packages[0].packages}' \
            > build/macos-provenance.json

      - name: Run installed product suite
        id: product
        timeout-minutes: 15
        continue-on-error: true
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite Product -PackageRoot "${RUNNER_TEMP}/port-package"

      - name: Run installed documentation examples
        id: documentation
        timeout-minutes: 10
        continue-on-error: true
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite Documentation -PackageRoot "${RUNNER_TEMP}/port-package"

      - name: Report both suite conclusions
        if: always()
        env:
          PRODUCT_OUTCOME: ${{ steps.product.outcome }}
          DOCUMENTATION_OUTCOME: ${{ steps.documentation.outcome }}
          CELL_RUNNER: ${{ matrix.runner }}
          CELL_POWERSHELL: ${{ matrix.powershell }}
          CELL_TMUX: ${{ matrix.tmux }}
        run: |
          mkdir -p build
          printf '{"runner":"%s","powershell":"%s","tmux":"%s","product":"%s","documentation":"%s"}\n' \
            "${CELL_RUNNER}" "${CELL_POWERSHELL}" "${CELL_TMUX}" \
            "${PRODUCT_OUTCOME}" "${DOCUMENTATION_OUTCOME}" \
            > build/macos-cell.json
          printf '| Runner | PowerShell | tmux | Product | Documentation |\n| --- | --- | --- | --- | --- |\n| %s | %s | %s | %s | %s |\n' \
            "${CELL_RUNNER}" "${CELL_POWERSHELL}" "${CELL_TMUX}" \
            "${PRODUCT_OUTCOME}" "${DOCUMENTATION_OUTCOME}" \
            >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${PRODUCT_OUTCOME}" != success || "${DOCUMENTATION_OUTCOME}" != success ]]; then
            printf '::warning::macOS trial suites failed: Product=%s, Documentation=%s\n' \
              "${PRODUCT_OUTCOME}" "${DOCUMENTATION_OUTCOME}"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-${{ matrix.runner }}-powershell-${{ matrix.powershell }}-tmux-${{ matrix.tmux }}
          path: |
            build/macos-cell.json
            build/macos-provenance.json
            build/test-Product.json
            build/test-Documentation.json
            ${{ runner.temp }}/port-package/package-evidence.json
            ${{ runner.temp }}/port-package/core-provenance.json
          if-no-files-found: warn
          retention-days: 7

  gate:
    needs: [package, matrix]
    if: always()
    name: macOS trial gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require package build and trial reporting
        run: |
          test "${{ needs.package.result }}" = success
          test "${{ needs.matrix.result }}" = success
