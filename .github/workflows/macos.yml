# Hosted macOS lane: both suites must pass in every Intel and Apple Silicon cell.
# The shared packages come from package.yml, which rebuilds a unique .NET review
# version from a pinned commit and does not prove committed unpublished archive bytes.
name: powershell macOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powershell-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_REVISION: 4c379e2905c4917fc71b75afd11256383774915a
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  package:
    name: source-pinned installed packages
    uses: ./.github/workflows/package.yml

  matrix:
    needs: package
    name: ${{ matrix.runner }} / PowerShell ${{ matrix.powershell }} / tmux ${{ matrix.tmux }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            asset_arch: x64
            powershell: '7.4.20'
            powershell_sha256: 634d04e806b37a441b140c875e96662a5eb14efd0e38060a730b991069602138
            tmux: '3.2a'
            tmux_commit: 3b929f332aafa7f1080eacc31feb11ffbb1d1841
          - runner: macos-15-intel
            arch: x86_64
            asset_arch: x64
            powershell: '7.4.20'
            powershell_sha256: 634d04e806b37a441b140c875e96662a5eb14efd0e38060a730b991069602138
            tmux: '3.7c'
            tmux_commit: e476c1230b958df0cb12977517d24b3dc931375b
          - runner: macos-15-intel
            arch: x86_64
            asset_arch: x64
            powershell: '7.6.6'
            powershell_sha256: e325ed9f666894eb39a5ea52800b602da2fb4242bbe9747ceddb39cdc66de805
            tmux: '3.2a'
            tmux_commit: 3b929f332aafa7f1080eacc31feb11ffbb1d1841
          - runner: macos-15-intel
            arch: x86_64
            asset_arch: x64
            powershell: '7.6.6'
            powershell_sha256: e325ed9f666894eb39a5ea52800b602da2fb4242bbe9747ceddb39cdc66de805
            tmux: '3.7c'
            tmux_commit: e476c1230b958df0cb12977517d24b3dc931375b
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
            powershell: '7.4.20'
            powershell_sha256: 7f9a2503304ee239330f5c4ccc7eef11894b095d7ccb8f9fa78a16c6ee508edc
            tmux: '3.2a'
            tmux_commit: 3b929f332aafa7f1080eacc31feb11ffbb1d1841
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
            powershell: '7.4.20'
            powershell_sha256: 7f9a2503304ee239330f5c4ccc7eef11894b095d7ccb8f9fa78a16c6ee508edc
            tmux: '3.7c'
            tmux_commit: e476c1230b958df0cb12977517d24b3dc931375b
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
            powershell: '7.6.6'
            powershell_sha256: 6df833d094ebac1c1a74340d7b3437f4aaf5e03ce640484a1c4359f3ce8b3db1
            tmux: '3.2a'
            tmux_commit: 3b929f332aafa7f1080eacc31feb11ffbb1d1841
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
            powershell: '7.6.6'
            powershell_sha256: 6df833d094ebac1c1a74340d7b3437f4aaf5e03ce640484a1c4359f3ce8b3db1
            tmux: '3.7c'
            tmux_commit: e476c1230b958df0cb12977517d24b3dc931375b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libtmux/libtmux-dotnet
          ref: ${{ env.CORE_REVISION }}
          path: core
          persist-credentials: false

      - uses: ./.github/actions/macos-toolchain
        with:
          arch: ${{ matrix.arch }}
          asset_arch: ${{ matrix.asset_arch }}
          powershell: ${{ matrix.powershell }}
          powershell_sha256: ${{ matrix.powershell_sha256 }}
          tmux: ${{ matrix.tmux }}
          tmux_commit: ${{ matrix.tmux_commit }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-package
          path: ${{ runner.temp }}/port-package

      - name: Verify package and binary provenance
        env:
          REVIEW_VERSION: ${{ needs.package.outputs.version }}
          TMUX_VERSION: ${{ matrix.tmux }}
          TMUX_SOURCE_COMMIT: ${{ matrix.tmux_commit }}
          POWERSHELL_VERSION: ${{ matrix.powershell }}
          POWERSHELL_SHA256: ${{ matrix.powershell_sha256 }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(command -v tmux)" = "${TMUX_BINARY}"
          test "$(git -C core rev-parse HEAD)" = "${CORE_REVISION}"
          jq -e --arg revision "${CORE_REVISION}" --arg version "${REVIEW_VERSION}" \
            '.revision == $revision and .version == $version and .inspection == "passed"' \
            "${RUNNER_TEMP}/port-package/core-provenance.json"
          jq -e '.packages | length == 2 and ([.[].file] | sort) == ["LibTmux.0.1.0.nupkg", "LibTmux.Workspace.0.1.0.nupkg"]' \
            "${RUNNER_TEMP}/port-package/package-evidence.json"
          jq -r '.packages[] | [.sha256, .file] | @tsv' \
            "${RUNNER_TEMP}/port-package/package-evidence.json" \
            | while IFS=$'\t' read -r digest file; do
                actual="$(shasum -a 256 "${RUNNER_TEMP}/port-package/${file}" | awk '{print $1}')"
                test "${actual}" = "${digest}"
              done
          mkdir -p build
          jq -n \
            --arg runner "${RUNNER_NAME}" \
            --arg arch "${EXPECTED_ARCH}" \
            --arg core "${CORE_REVISION}" \
            --arg reviewVersion "${REVIEW_VERSION}" \
            --arg powershell "${POWERSHELL_VERSION}" \
            --arg powershellSha256 "${POWERSHELL_SHA256}" \
            --arg powershellBinarySha256 "$(shasum -a 256 "${RUNNER_TEMP}/powershell/pwsh" | awk '{print $1}')" \
            --arg tmux "${TMUX_VERSION}" \
            --arg tmuxCommit "${TMUX_SOURCE_COMMIT}" \
            --arg tmuxSha256 "$(shasum -a 256 "${TMUX_BINARY}" | awk '{print $1}')" \
            --arg python "$(python3 --version)" \
            --rawfile buildDependencies "${RUNNER_TEMP}/tmux-build-dependencies.txt" \
            --slurpfile packages "${RUNNER_TEMP}/port-package/package-evidence.json" \
            '{runner:$runner,arch:$arch,coreRevision:$core,reviewVersion:$reviewVersion,
              powershell:$powershell,powershellSha256:$powershellSha256,
              powershellBinarySha256:$powershellBinarySha256,
              tmux:$tmux,tmuxCommit:$tmuxCommit,tmuxSha256:$tmuxSha256,
              python:$python,buildDependencies:$buildDependencies,packages:$packages[0].packages}' \
            > build/macos-provenance.json

      - name: Run installed product suite
        id: product
        timeout-minutes: 15
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite Product -PackageRoot "${RUNNER_TEMP}/port-package"

      - name: Run installed documentation examples
        id: documentation
        timeout-minutes: 10
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite Documentation -PackageRoot "${RUNNER_TEMP}/port-package"

      - name: Record and require both suite conclusions
        if: always()
        env:
          PRODUCT_OUTCOME: ${{ steps.product.outcome }}
          DOCUMENTATION_OUTCOME: ${{ steps.documentation.outcome }}
          CELL_RUNNER: ${{ matrix.runner }}
          CELL_POWERSHELL: ${{ matrix.powershell }}
          CELL_TMUX: ${{ matrix.tmux }}
        run: |
          mkdir -p build
          printf '{"runner":"%s","powershell":"%s","tmux":"%s","product":"%s","documentation":"%s"}\n' \
            "${CELL_RUNNER}" "${CELL_POWERSHELL}" "${CELL_TMUX}" \
            "${PRODUCT_OUTCOME}" "${DOCUMENTATION_OUTCOME}" \
            > build/macos-cell.json
          printf '| Runner | PowerShell | tmux | Product | Documentation |\n| --- | --- | --- | --- | --- |\n| %s | %s | %s | %s | %s |\n' \
            "${CELL_RUNNER}" "${CELL_POWERSHELL}" "${CELL_TMUX}" \
            "${PRODUCT_OUTCOME}" "${DOCUMENTATION_OUTCOME}" \
            >> "${GITHUB_STEP_SUMMARY}"
          test "${PRODUCT_OUTCOME}" = success
          test "${DOCUMENTATION_OUTCOME}" = success

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-${{ matrix.runner }}-powershell-${{ matrix.powershell }}-tmux-${{ matrix.tmux }}
          path: |
            build/macos-cell.json
            build/macos-provenance.json
            build/test-Product.json
            build/test-Documentation.json
            ${{ runner.temp }}/port-package/package-evidence.json
            ${{ runner.temp }}/port-package/core-provenance.json
          if-no-files-found: warn
          retention-days: 7

  gate:
    needs: [package, matrix]
    if: always()
    name: macOS gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require package build and all eight cells
        run: |
          test "${{ needs.package.result }}" = success
          test "${{ needs.matrix.result }}" = success
