# Restore the published .NET dependencies with the committed package locks.
name: powershell

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
    inputs:
      scope:
        description: How much of the tmux table to cover. The release workflow passes full.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          edges runs the oldest and newest tmux, full runs the whole table,
          tmux master and the refusal lanes, custom runs the refs in tmux-ref.
          A release is bound to a full run.
        type: choice
        options: [edges, full, custom]
        default: edges
      tmux-ref:
        description: >-
          With scope custom, comma-separated tmux versions, tags, branches or
          40-hex commit SHAs from github.com/tmux/tmux, such as 3.6b,master.
        type: string
        default: ''
      pwsh:
        description: >-
          Comma-separated PowerShell versions from eng/ci/matrix.json, such as
          7.4.20,7.6.6. Empty runs both.
        type: string
        default: ''
      tmate:
        description: >-
          Open a tmate SSH session for the person who started the run, before
          the tests or only after a failure. It needs scope custom with one
          tmux-ref and one pwsh version, so that exactly one leg gets it.
        type: choice
        options: [off, before-tests, on-failure]
        default: off

permissions:
  contents: read

concurrency:
  # A dispatch is a request for that run, so another dispatch on the same ref
  # does not cancel it and it does not cancel the ref's push run.
  group: powershell-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  CORE_REVISION: 472c2bcfbda6735139849324cc109ad70300001e
  CORE_PACKAGE_VERSION: '0.1.0'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # What a run covers is decided here from eng/ci/matrix.json and the event, so
  # no job below lists a version. A push and a pull request test the oldest and
  # newest tmux release; a dispatch with scope full tests the whole table, and
  # a Gallery release is bound to such a run.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      reject: ${{ steps.plan.outputs.reject }}
      run_reject: ${{ steps.plan.outputs.run_reject }}
      old_daemon: ${{ steps.plan.outputs.old_daemon }}
      run_old_daemon: ${{ steps.plan.outputs.run_old_daemon }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: eng/ci

      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          TMUX_REF: ${{ inputs.tmux-ref }}
          PWSH: ${{ inputs.pwsh }}
          TMATE: ${{ inputs.tmate }}
        run: |
          python3 eng/ci/plan_matrix.py plan \
            --event "${EVENT}" \
            --scope "${SCOPE}" \
            --tmux-ref "${TMUX_REF}" \
            --pwsh "${PWSH}" \
            --tmate "${TMATE}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

  port:
    needs: plan
    name: build and pack PowerShell modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install official PowerShell 7.4.20
        run: |
          archive="${RUNNER_TEMP}/powershell-7.4.20-linux-x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/PowerShell/PowerShell/releases/download/v7.4.20/powershell-7.4.20-linux-x64.tar.gz \
            --output "${archive}"
          echo "ed8008345c7f5337f5e293145f5e243ce132e5ee4dfc24ac551c45a4b3092181  ${archive}" \
            | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/powershell"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/powershell"
          chmod +x "${RUNNER_TEMP}/powershell/pwsh"
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -Command \
            "if (\$PSVersionTable.PSVersion.ToString() -cne '7.4.20') { throw 'Unexpected PowerShell version' }; Import-Module Microsoft.PowerShell.PSResourceGet -RequiredVersion 1.1.1"

      - name: Test optional review dependency helpers
        run: python3 -m unittest discover -s eng/ci -p 'test_*.py'

      - name: Build from locked NuGet dependencies
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Build.ps1 \
            -Restore \
            -PackageCache "${RUNNER_TEMP}/port-nuget-cache"

      - name: Check source, examples, and generated help
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Setup.ps1
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Lint.ps1
          python3 eng/check_example_width.py --self-test
          python3 eng/check_example_width.py
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Help.ps1 -Check
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File tests/GuideExamples.Tests.ps1
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File tests/ReadmeLinks.Tests.ps1
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File tests/BootstrapReview.Tests.ps1
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File tests/Publish.Tests.ps1
          dotnet format src/LibTmux.PowerShell/LibTmux.PowerShell.csproj \
            --verify-no-changes --no-restore
          dotnet format src/LibTmux.Workspace.PowerShell/LibTmux.Workspace.PowerShell.csproj \
            --verify-no-changes --no-restore
          git diff --check

      - name: Verify native documentation export
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Export-Docs.ps1
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File tests/DocsExport.Tests.ps1

      - name: Preserve native documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powershell-docs-api
          path: build/docs/api.json
          if-no-files-found: error
          retention-days: 7

      - name: Pack the modules once for every test lane
        run: |
          PSModulePath="${GITHUB_WORKSPACE}/build/Modules" \
            "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Package.ps1 \
            -DestinationPath "${RUNNER_TEMP}/port-package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: port-package
          path: ${{ runner.temp }}/port-package/
          if-no-files-found: error
          retention-days: 7

  matrix:
    needs: [plan, port]
    name: PowerShell ${{ matrix.powershell }} / tmux ${{ matrix.tmux }}
    runs-on: ubuntu-24.04
    # The leg that holds a debugging session gets the time to use it.
    timeout-minutes: ${{ matrix.tmate == 'off' && 20 || 50 }}
    strategy:
      fail-fast: false
      max-parallel: 8
      # The plan chooses the legs and never leaves this empty.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libtmux/libtmux-dotnet
          ref: ${{ env.CORE_REVISION }}
          path: core
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install official PowerShell ${{ matrix.powershell }}
        env:
          POWERSHELL_VERSION: ${{ matrix.powershell }}
          POWERSHELL_SHA256: ${{ matrix.powershell_sha256 }}
        run: |
          archive="${RUNNER_TEMP}/powershell-${POWERSHELL_VERSION}-linux-x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/PowerShell/PowerShell/releases/download/v${POWERSHELL_VERSION}/powershell-${POWERSHELL_VERSION}-linux-x64.tar.gz" \
            --output "${archive}"
          echo "${POWERSHELL_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/powershell"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/powershell"
          chmod +x "${RUNNER_TEMP}/powershell/pwsh"
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -Command \
            "if (\$PSVersionTable.PSVersion.ToString() -cne \$env:POWERSHELL_VERSION) { throw 'Unexpected PowerShell version' }"

      - name: Install tmux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake bison build-essential jq \
            libevent-dev libncurses-dev pkg-config

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/artifacts/tmux
          key: tmux-${{ matrix.tmux }}-${{ runner.os }}-${{ hashFiles('core/eng/tmux/build-version.sh') }}

      # A tag, branch or commit outside the table is built from source at the
      # commit it names. The commit is resolved first so that the cache key
      # holds it and never the branch name.
      - name: Resolve the tmux ref
        id: resolve
        if: matrix.build == 'ref'
        env:
          TMUX_REF: ${{ matrix.tmux }}
        run: eng/ci/build-tmux.sh --resolve "${TMUX_REF}" | tee -a "${GITHUB_OUTPUT}"

      - name: Restore the tmux ref build
        if: matrix.build == 'ref'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tmux-ref
          key: tmux-ref-${{ steps.resolve.outputs.commit }}-${{ runner.os }}-${{ hashFiles('eng/ci/build-tmux.sh') }}

      - name: Build and identify tmux ${{ matrix.tmux }} from a ref
        if: matrix.build == 'ref'
        env:
          TMUX_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          eng/ci/build-tmux.sh --ref "${TMUX_COMMIT}" | tee "${RUNNER_TEMP}/tmux-ref.txt"
          binary="$(sed -n 's/^binary=//p' "${RUNNER_TEMP}/tmux-ref.txt")"
          dirname "${binary}" >> "${GITHUB_PATH}"
          printf 'TMUX_BINARY=%s\n' "${binary}" >> "${GITHUB_ENV}"

      - name: Build and identify tmux ${{ matrix.tmux }} from source
        if: matrix.build == 'clone'
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
          TMUX_SOURCE_COMMIT: ${{ matrix.tmux_commit }}
        run: |
          source="${RUNNER_TEMP}/tmux-source"
          if [ -z "${TMUX_SOURCE_COMMIT}" ]; then
            git clone --quiet --depth 1 https://github.com/tmux/tmux.git "${source}"
          else
            git clone --quiet --depth 1 --branch "${TMUX_VERSION}" https://github.com/tmux/tmux.git "${source}"
            test "$(git -C "${source}" rev-parse HEAD)" = "${TMUX_SOURCE_COMMIT}"
          fi
          echo "tmux source commit: $(git -C "${source}" rev-parse HEAD)"
          (cd "${source}" \
            && sh autogen.sh \
            && ./configure --prefix="${RUNNER_TEMP}/tmux-install" \
            && make --jobs="$(nproc)" \
            && make install)
          binary="${RUNNER_TEMP}/tmux-install/bin/tmux"
          if [ -z "${TMUX_SOURCE_COMMIT}" ]; then
            "${binary}" -V | grep -E '^tmux next-[0-9]+\.[0-9]+$'
          else
            test "$("${binary}" -V)" = "tmux ${TMUX_VERSION}"
          fi
          echo "${RUNNER_TEMP}/tmux-install/bin" >> "${GITHUB_PATH}"
          printf 'TMUX_BINARY=%s\n' "${binary}" >> "${GITHUB_ENV}"

      - name: Build and identify tmux ${{ matrix.tmux }}
        id: tmux
        if: matrix.build == 'core'
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
          TMUX_SOURCE_COMMIT: ${{ matrix.tmux_commit }}
        run: |
          test "$(git -C core rev-parse HEAD)" = "${CORE_REVISION}"
          core/eng/tmux/build-version.sh "${TMUX_VERSION}" | tee -a "${GITHUB_OUTPUT}"
          binary="core/artifacts/tmux/installs/${TMUX_VERSION}/bin/tmux"
          test -x "${binary}"
          test "$(cat "core/artifacts/tmux/installs/${TMUX_VERSION}/source-commit")" = "${TMUX_SOURCE_COMMIT}"
          test "$("${binary}" -V)" = "tmux ${TMUX_VERSION}"
          realpath "$(dirname "${binary}")" >> "${GITHUB_PATH}"
          printf 'TMUX_BINARY=%s\n' "$(realpath "${binary}")" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: port-package
          path: ${{ runner.temp }}/port-package

      # A debugging session is for a dispatch, and the plan gives it to exactly
      # one leg. It is limited to the person who started the run, who needs an
      # SSH key on their GitHub profile, and it is closed after the step's limit.
      - name: Debug session before the tests
        if: github.event_name == 'workflow_dispatch' && matrix.tmate == 'before-tests'
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        continue-on-error: true
        with:
          limit-access-to-actor: true

      - name: Check the installed package bytes and run product suites
        run: |
          test "$(command -v tmux)" = "${TMUX_BINARY}"
          jq -r '.packages[] | [.sha256, .file] | @tsv' \
            "${RUNNER_TEMP}/port-package/package-evidence.json" \
            | while IFS=$'\t' read -r digest file; do
                echo "${digest}  ${RUNNER_TEMP}/port-package/${file}" | sha256sum --check --strict
              done
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite Product -PackageRoot "${RUNNER_TEMP}/port-package"

      - name: Run installed documentation examples
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite Documentation -PackageRoot "${RUNNER_TEMP}/port-package"

      - name: Discover the separate MCP tool
        if: matrix.mcp == 'true'
        env:
          MCP_VERSION: ${{ env.CORE_PACKAGE_VERSION }}
        run: |
          dotnet tool install LibTmux.Mcp \
            --tool-path "${RUNNER_TEMP}/mcp-tool" \
            --version "${MCP_VERSION}" \
            --framework net8.0
          dotnet restore tests/support/McpDiscovery/McpDiscovery.csproj --locked-mode
          dotnet build tests/support/McpDiscovery/McpDiscovery.csproj \
            --configuration Release --no-restore --warnaserror
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite Mcp \
            -McpCommand "${RUNNER_TEMP}/mcp-tool/libtmux-mcp" \
            -McpVersion "${MCP_VERSION}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-powershell-${{ matrix.powershell }}-tmux-${{ matrix.slug }}
          path: |
            build/test-Product.json
            build/test-Documentation.json
            build/guide-skips-*.json
            build/test-Mcp.json
            ${{ runner.temp }}/port-package/package-evidence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Debug session after a failure
        if: failure() && github.event_name == 'workflow_dispatch' && matrix.tmate == 'on-failure'
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

  # Releases below the floor: the suite asserts refusal with no effects. They
  # do not depend on which tmux a push touches, so they run where the plan asks
  # for the whole table.
  reject:
    needs: [plan, port]
    if: needs.plan.outputs.run_reject == 'true'
    name: PowerShell ${{ matrix.powershell }} / tmux ${{ matrix.tmux }} rejected
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.reject) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install official PowerShell ${{ matrix.powershell }}
        env:
          POWERSHELL_VERSION: ${{ matrix.powershell }}
          POWERSHELL_SHA256: ${{ matrix.powershell_sha256 }}
        run: |
          archive="${RUNNER_TEMP}/powershell-${POWERSHELL_VERSION}-linux-x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/PowerShell/PowerShell/releases/download/v${POWERSHELL_VERSION}/powershell-${POWERSHELL_VERSION}-linux-x64.tar.gz" \
            --output "${archive}"
          echo "${POWERSHELL_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/powershell"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/powershell"
          chmod +x "${RUNNER_TEMP}/powershell/pwsh"

      - name: Install tmux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake bison build-essential \
            libevent-dev libncurses-dev pkg-config

      - name: Build and identify tmux ${{ matrix.tmux }}
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
          TMUX_SOURCE_COMMIT: ${{ matrix.tmux_commit }}
        run: |
          git clone --quiet https://github.com/tmux/tmux.git "${RUNNER_TEMP}/tmux-source"
          git -C "${RUNNER_TEMP}/tmux-source" checkout --quiet "${TMUX_SOURCE_COMMIT}"
          test "$(git -C "${RUNNER_TEMP}/tmux-source" describe --tags --exact-match)" = "${TMUX_VERSION}"
          (cd "${RUNNER_TEMP}/tmux-source" \
            && sh autogen.sh \
            && ./configure --prefix="${RUNNER_TEMP}/tmux-install" \
            && make --jobs="$(nproc)" \
            && make install)
          test "$("${RUNNER_TEMP}/tmux-install/bin/tmux" -V)" = "tmux ${TMUX_VERSION}"
          echo "${RUNNER_TEMP}/tmux-install/bin" >> "${GITHUB_PATH}"
          printf 'TMUX_BINARY=%s\n' "${RUNNER_TEMP}/tmux-install/bin/tmux" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: port-package
          path: ${{ runner.temp }}/port-package

      - name: Check the installed package bytes and run the rejection suite
        run: |
          test "$(command -v tmux)" = "${TMUX_BINARY}"
          jq -r '.packages[] | [.sha256, .file] | @tsv' \
            "${RUNNER_TEMP}/port-package/package-evidence.json" \
            | while IFS=$'\t' read -r digest file; do
                echo "${digest}  ${RUNNER_TEMP}/port-package/${file}" | sha256sum --check --strict
              done
          LIBTMUX_REQUIRE_REJECTED="${{ matrix.tmux }}" \
            "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite VersionCheck -PackageRoot "${RUNNER_TEMP}/port-package"

  # Releases whose daemon cannot report a version: the suite refuses them
  # promptly. The client is the oldest supported release.
  reject-old-daemon:
    needs: [plan, port]
    if: needs.plan.outputs.run_old_daemon == 'true'
    name: PowerShell ${{ matrix.powershell }} / tmux ${{ matrix.tmux }} daemon behind a ${{ matrix.client_tmux }} client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.old_daemon) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install official PowerShell ${{ matrix.powershell }}
        env:
          POWERSHELL_VERSION: ${{ matrix.powershell }}
          POWERSHELL_SHA256: ${{ matrix.powershell_sha256 }}
        run: |
          archive="${RUNNER_TEMP}/powershell-${POWERSHELL_VERSION}-linux-x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/PowerShell/PowerShell/releases/download/v${POWERSHELL_VERSION}/powershell-${POWERSHELL_VERSION}-linux-x64.tar.gz" \
            --output "${archive}"
          echo "${POWERSHELL_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/powershell"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/powershell"
          chmod +x "${RUNNER_TEMP}/powershell/pwsh"

      - name: Install tmux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake bison build-essential \
            libevent-dev libncurses-dev pkg-config

      - name: Build the ${{ matrix.client_tmux }} client and the old daemon
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
          TMUX_SOURCE_COMMIT: ${{ matrix.tmux_commit }}
          CLIENT_VERSION: ${{ matrix.client_tmux }}
          CLIENT_SOURCE_COMMIT: ${{ matrix.client_commit }}
        run: |
          source="${RUNNER_TEMP}/tmux-source"
          git clone --quiet https://github.com/tmux/tmux.git "${source}"
          build() {
            git -C "${source}" checkout --quiet "$1"
            test "$(git -C "${source}" describe --tags --exact-match)" = "$2"
            (cd "${source}" \
              && git clean --quiet -fdx \
              && sh autogen.sh \
              && ./configure --prefix="${RUNNER_TEMP}/tmux-$2" \
              && make --jobs="$(nproc)" \
              && make install)
            test "$("${RUNNER_TEMP}/tmux-$2/bin/tmux" -V)" = "tmux $2"
          }
          build "${CLIENT_SOURCE_COMMIT}" "${CLIENT_VERSION}"
          build "${TMUX_SOURCE_COMMIT}" "${TMUX_VERSION}"
          echo "${RUNNER_TEMP}/tmux-${CLIENT_VERSION}/bin" >> "${GITHUB_PATH}"
          printf 'TMUX_BINARY=%s\n' "${RUNNER_TEMP}/tmux-${CLIENT_VERSION}/bin/tmux" >> "${GITHUB_ENV}"
          printf 'LIBTMUX_OLD_DAEMON=%s\n' "${RUNNER_TEMP}/tmux-${TMUX_VERSION}/bin/tmux" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: port-package
          path: ${{ runner.temp }}/port-package

      - name: Check the installed package bytes and run the old-daemon suite
        run: |
          test "$(command -v tmux)" = "${TMUX_BINARY}"
          jq -r '.packages[] | [.sha256, .file] | @tsv' \
            "${RUNNER_TEMP}/port-package/package-evidence.json" \
            | while IFS=$'\t' read -r digest file; do
                echo "${digest}  ${RUNNER_TEMP}/port-package/${file}" | sha256sum --check --strict
              done
          LIBTMUX_REQUIRE_OLD_DAEMON="${{ matrix.tmux }}" \
            "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite VersionCheck -PackageRoot "${RUNNER_TEMP}/port-package"

  # A lane the plan left out of scope must be skipped and a lane it planned
  # must succeed. Accepting a skip for a planned lane would let a failure that
  # skips its dependents pass.
  gate:
    needs: [plan, port, matrix, reject, reject-old-daemon]
    if: always()
    name: powershell gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: eng/ci

      - name: Require every planned job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 eng/ci/plan_matrix.py gate
