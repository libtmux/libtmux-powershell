# Restore the published .NET dependencies with the committed package locks.
name: powershell

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
    inputs:
      scope:
        description: How much of the tmux table to cover. The release workflow passes full.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          edges runs the oldest and newest tmux, full runs the whole table,
          tmux master and the refusal lanes, custom runs the refs in tmux-ref.
          A release is bound to a full run.
        type: choice
        options: [edges, full, custom]
        default: edges
      tmux-ref:
        description: >-
          With scope custom, comma-separated tmux versions, tags, branches or
          40-hex commit SHAs from github.com/tmux/tmux, such as 3.6b,master.
        type: string
        default: ''
      pwsh:
        description: >-
          Comma-separated PowerShell versions from scripts/plan-matrix/matrix.json, such as
          7.4.20,7.6.6. Empty runs both.
        type: string
        default: ''
      tmate:
        description: >-
          Open a tmate SSH session for the person who started the run, before
          the tests or only after a failure. It needs scope custom with one
          tmux-ref and one pwsh version, so that exactly one leg gets it.
        type: choice
        # Quoted, because YAML 1.1 reads a bare off as false, which GitHub then
        # offers as the only allowed value and passes to the plan as 'false'.
        options: ['off', before-tests, on-failure]
        default: 'off'

permissions:
  contents: read

concurrency:
  # A dispatch is a request for that run, so another dispatch on the same ref
  # does not cancel it and it does not cancel the ref's push run.
  group: powershell-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # What a run covers is decided here from scripts/plan-matrix/matrix.json and
  # the event, so no job below lists a version. A push and a pull request test
  # the oldest and newest tmux release; a dispatch with scope full tests the
  # whole table, and a Gallery release is bound to such a run.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      reject: ${{ steps.plan.outputs.reject }}
      run_reject: ${{ steps.plan.outputs.run_reject }}
      old_daemon: ${{ steps.plan.outputs.old_daemon }}
      run_old_daemon: ${{ steps.plan.outputs.run_old_daemon }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/plan-matrix

      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          TMUX_REF: ${{ inputs.tmux-ref }}
          PWSH: ${{ inputs.pwsh }}
          TMATE: ${{ inputs.tmate }}
        run: |
          pwsh -NoLogo -NoProfile -File scripts/plan-matrix/PlanMatrix.ps1 plan \
            -EventName "${EVENT}" \
            -Scope "${SCOPE}" \
            -TmuxRef "${TMUX_REF}" \
            -Pwsh "${PWSH}" \
            -Tmate "${TMATE}" \
            -GithubOutput "${GITHUB_OUTPUT}" \
            -Summary "${GITHUB_STEP_SUMMARY}"

  port:
    needs: plan
    name: build and pack PowerShell modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install official PowerShell 7.4.20
        run: pwsh -NoLogo -NoProfile -File scripts/install-powershell/InstallPowerShell.ps1 -Version 7.4.20

      - name: Test the CI planner
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/plan-matrix/tests/PlanMatrix.Tests.ps1

      - name: Test the CI table against the documents
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/plan-matrix/tests/MatrixManifest.Tests.ps1

      - name: Test the release binding
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/release-artifacts/tests/ReleaseArtifacts.Tests.ps1

      - name: Test the dependency review
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/review-dependencies/tests/ReviewDependencies.Tests.ps1

      - name: Test the workflow check
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/check-workflows/tests/CheckWorkflows.Tests.ps1

      - name: Test the PowerShell installer
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/install-powershell/tests/InstallPowerShell.Tests.ps1

      - name: Test the package verifier
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/verify-package/tests/VerifyPackage.Tests.ps1

      - name: Test the release source check
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/release-source/tests/ReleaseSource.Tests.ps1

      - name: Test the docs preview cleanup
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/docs-preview-cleanup/tests/DocsPreviewCleanup.Tests.ps1

      - name: Test the macOS tmux build checks
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/build-tmux-macos/tests/BuildTmuxMacos.Tests.ps1

      - name: Test the macOS trial records
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/macos-trial/tests/MacosTrial.Tests.ps1

      - name: Check the workflows
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/check-workflows/CheckWorkflows.ps1

      - name: Build from locked NuGet dependencies
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Build.ps1 \
            -Restore \
            -PackageCache "${RUNNER_TEMP}/port-nuget-cache"

      - name: Check example width
        uses: libtmux/.github/actions/check-example-width@bd3bae79572512da032287202d74c8da03b5967b

      - name: Install the pinned analyzer
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File eng/Setup.ps1

      - name: Analyse the PowerShell
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File eng/Lint.ps1

      - name: Check the generated help
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File eng/Help.ps1 -Check

      - name: Check the guide examples
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File tests/GuideExamples.Tests.ps1

      - name: Check the README links
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File tests/ReadmeLinks.Tests.ps1

      - name: Review the bootstrap
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File tests/BootstrapReview.Tests.ps1

      - name: Test publishing
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File tests/Publish.Tests.ps1

      - name: Test the changelog checks
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File tests/Changelog.Tests.ps1

      - name: Check the format of the core cmdlets
        run: >-
          dotnet format src/LibTmux.PowerShell/LibTmux.PowerShell.csproj
          --verify-no-changes --no-restore

      - name: Check the format of the workspace cmdlets
        run: >-
          dotnet format src/LibTmux.Workspace.PowerShell/LibTmux.Workspace.PowerShell.csproj
          --verify-no-changes --no-restore

      - name: Check for whitespace errors
        run: git diff --check

      - name: Export the native documentation
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File eng/Export-Docs.ps1

      - name: Verify the native documentation export
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File tests/DocsExport.Tests.ps1

      - name: Preserve native documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powershell-docs-api
          path: build/docs/api.json
          if-no-files-found: error
          retention-days: 7

      - name: Pack the modules once for every test lane
        run: |
          PSModulePath="${GITHUB_WORKSPACE}/build/Modules" \
            "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Package.ps1 \
            -DestinationPath "${RUNNER_TEMP}/port-package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: port-package
          path: ${{ runner.temp }}/port-package/
          if-no-files-found: error
          retention-days: 7

  matrix:
    needs: [plan, port]
    name: PowerShell ${{ matrix.powershell }} / tmux ${{ matrix.tmux }}
    runs-on: ubuntu-24.04
    # The leg that holds a debugging session gets the time to use it.
    timeout-minutes: ${{ matrix.tmate == 'off' && 20 || 50 }}
    strategy:
      fail-fast: false
      max-parallel: 8
      # The plan chooses the legs and never leaves this empty.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install official PowerShell ${{ matrix.powershell }}
        env:
          POWERSHELL_VERSION: ${{ matrix.powershell }}
        run: pwsh -NoLogo -NoProfile -File scripts/install-powershell/InstallPowerShell.ps1 -Version "${POWERSHELL_VERSION}"

      # A table release builds from the commit the table pins, and any other tag,
      # branch or commit from the one it resolves to. The action caches the
      # build, installs what it links, and puts it first on PATH.
      - name: Build tmux ${{ matrix.tmux }}
        id: tmux
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.tmux_commit || matrix.tmux }}
          add-to-path: 'true'

      - name: Select the tmux build
        env:
          TMUX_BUILD: ${{ steps.tmux.outputs.binary }}
        run: printf 'TMUX_BINARY=%s\n' "${TMUX_BUILD}" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: port-package
          path: ${{ runner.temp }}/port-package

      # A debugging session is for a dispatch, and the plan gives it to exactly
      # one leg. It is limited to the person who started the run, who needs an
      # SSH key on their GitHub profile, and it is closed after the step's limit.
      - name: Debug session before the tests
        if: github.event_name == 'workflow_dispatch' && matrix.tmate == 'before-tests'
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        continue-on-error: true
        with:
          limit-access-to-actor: true

      - name: Check the installed package bytes
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/verify-package/VerifyPackage.ps1
          -PackageRoot "${RUNNER_TEMP}/port-package"
          -ExpectedTmux "${TMUX_BINARY}"

      - name: Run product suites
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File eng/Test.ps1
          -Suite Product
          -PackageRoot "${RUNNER_TEMP}/port-package"

      - name: Run installed documentation examples
        run: |
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile -File eng/Test.ps1 \
            -Suite Documentation -PackageRoot "${RUNNER_TEMP}/port-package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-powershell-${{ matrix.powershell }}-tmux-${{ matrix.slug }}
          path: |
            build/test-Product.json
            build/test-Documentation.json
            build/guide-skips-*.json
            ${{ runner.temp }}/port-package/package-evidence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Debug session after a failure
        if: failure() && github.event_name == 'workflow_dispatch' && matrix.tmate == 'on-failure'
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

  # Releases below the floor: the suite asserts refusal with no effects. They
  # do not depend on which tmux a push touches, so they run where the plan asks
  # for the whole table.
  reject:
    needs: [plan, port]
    if: needs.plan.outputs.run_reject == 'true'
    name: PowerShell ${{ matrix.powershell }} / tmux ${{ matrix.tmux }} rejected
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.reject) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install official PowerShell ${{ matrix.powershell }}
        env:
          POWERSHELL_VERSION: ${{ matrix.powershell }}
        run: pwsh -NoLogo -NoProfile -File scripts/install-powershell/InstallPowerShell.ps1 -Version "${POWERSHELL_VERSION}"

      - name: Build tmux ${{ matrix.tmux }}
        id: tmux
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.tmux_commit }}
          add-to-path: 'true'

      - name: Select the tmux build
        env:
          TMUX_BUILD: ${{ steps.tmux.outputs.binary }}
        run: printf 'TMUX_BINARY=%s\n' "${TMUX_BUILD}" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: port-package
          path: ${{ runner.temp }}/port-package

      - name: Check the installed package bytes
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/verify-package/VerifyPackage.ps1
          -PackageRoot "${RUNNER_TEMP}/port-package"
          -ExpectedTmux "${TMUX_BINARY}"

      - name: Run the rejection suite
        env:
          LIBTMUX_REQUIRE_REJECTED: ${{ matrix.tmux }}
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File eng/Test.ps1
          -Suite VersionCheck
          -PackageRoot "${RUNNER_TEMP}/port-package"

  # Releases whose daemon cannot report a version: the suite refuses them
  # promptly. The client is the oldest supported release.
  reject-old-daemon:
    needs: [plan, port]
    if: needs.plan.outputs.run_old_daemon == 'true'
    name: PowerShell ${{ matrix.powershell }} / tmux ${{ matrix.tmux }} daemon behind a ${{ matrix.client_tmux }} client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.old_daemon) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install official PowerShell ${{ matrix.powershell }}
        env:
          POWERSHELL_VERSION: ${{ matrix.powershell }}
        run: pwsh -NoLogo -NoProfile -File scripts/install-powershell/InstallPowerShell.ps1 -Version "${POWERSHELL_VERSION}"

      - name: Build the tmux ${{ matrix.client_tmux }} client
        id: client
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.client_commit }}
          prefix: /home/runner/tmux-client
          add-to-path: 'true'

      - name: Build the tmux ${{ matrix.tmux }} daemon
        id: daemon
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.tmux_commit }}
          prefix: /home/runner/tmux-daemon

      - name: Select the client and the old daemon
        env:
          CLIENT_BUILD: ${{ steps.client.outputs.binary }}
          DAEMON_BUILD: ${{ steps.daemon.outputs.binary }}
        run: printf 'TMUX_BINARY=%s\nLIBTMUX_OLD_DAEMON=%s\n' "${CLIENT_BUILD}" "${DAEMON_BUILD}" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: port-package
          path: ${{ runner.temp }}/port-package

      - name: Check the installed package bytes
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File scripts/verify-package/VerifyPackage.ps1
          -PackageRoot "${RUNNER_TEMP}/port-package"
          -ExpectedTmux "${TMUX_BINARY}"

      - name: Run the old-daemon suite
        env:
          LIBTMUX_REQUIRE_OLD_DAEMON: ${{ matrix.tmux }}
        run: >-
          "${RUNNER_TEMP}/powershell/pwsh" -NoLogo -NoProfile
          -File eng/Test.ps1
          -Suite VersionCheck
          -PackageRoot "${RUNNER_TEMP}/port-package"

  # A lane the plan left out of scope must be skipped and a lane it planned
  # must succeed. Accepting a skip for a planned lane would let a failure that
  # skips its dependents pass.
  gate:
    needs: [plan, port, matrix, reject, reject-old-daemon]
    if: always()
    name: powershell gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/plan-matrix

      - name: Require every planned job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: pwsh -NoLogo -NoProfile -File scripts/plan-matrix/PlanMatrix.ps1 gate
